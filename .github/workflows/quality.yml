name: SGCI Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply semantic Cuban address parser changes
        run: python .github/semantic_parser_fix.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=@sgci/api -- prisma generate --schema prisma/schema.prisma

      - name: Validate Prisma schema
        run: npm exec --workspace=@sgci/api -- prisma validate --schema prisma/schema.prisma

      - name: Validate TypeScript API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Validate TypeScript Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Lint API
        run: npm run lint --workspace=@sgci/api

      - name: Lint Web
        run: npm run lint --workspace=@sgci/web

      - name: Format with exact Prettier 3.9.6
        run: npx prettier@3.9.6 --write apps/api/src/geocodificacion/geocodificacion.service.ts apps/api/src/geocodificacion/geocodificacion.service.spec.ts

      - name: Check exact Prettier 3.9.6
        run: npx prettier@3.9.6 --check apps/api/src/geocodificacion/geocodificacion.service.ts apps/api/src/geocodificacion/geocodificacion.service.spec.ts

      - name: Run API tests
        run: npm test --workspace=@sgci/api

      - name: Build API
        run: npm run build --workspace=@sgci/api

      - name: Build Web
        run: npm run build --workspace=@sgci/web

      - name: Commit parser changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/quality.yml > .github/workflows/quality.yml
          git rm -f .github/workflows/semantic-parser-fix.yml .github/semantic_parser_fix.py || true
          git add apps/api/src/geocodificacion/geocodificacion.service.ts apps/api/src/geocodificacion/geocodificacion.service.spec.ts .github/workflows/quality.yml
          git commit -m "fix(geocoding): parse Cuban address semantics"
          git push
