name: SGCI Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=@sgci/api -- prisma generate --schema prisma/schema.prisma

      - name: Validate Prisma schema
        run: npm exec --workspace=@sgci/api -- prisma validate --schema prisma/schema.prisma

      - name: Validate TypeScript API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Validate TypeScript Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Lint API
        run: npm run lint --workspace=@sgci/api

      - name: Lint Web
        run: npm run lint --workspace=@sgci/web

      - name: Format Prettier
        run: |
          npx prettier --write apps/api/src/manifiestos/manifiestos.service.ts
          if ! git diff --quiet -- apps/api/src/manifiestos/manifiestos.service.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/manifiestos/manifiestos.service.ts
            git commit -m "style: aplicar formato Prettier"
            git push
          fi

      - name: Check formatting
        run: npx prettier --check "apps/**/*.{ts,tsx,js,jsx,json,css,md}"

      - name: Run API tests
        run: npm test --workspace=@sgci/api

      - name: Build API
        run: npm run build --workspace=@sgci/api

      - name: Build Web
        run: npm run build --workspace=@sgci/web
