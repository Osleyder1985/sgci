name: Prettier Fix

on:
  push:
    branches:
      - fix/geocoding-locationiq-structured-postalcode

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format affected test
        working-directory: apps/api
        run: |
          npm ci
          npx --yes prettier@3.9.6 --write src/geocodificacion/cuba-aware-geocodificacion.service.spec.ts
          npx --yes prettier@3.9.6 --check src/geocodificacion/cuba-aware-geocodificacion.service.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/geocodificacion/cuba-aware-geocodificacion.service.spec.ts
          git commit -m "style(geocoding): format Cuba-aware tests"
          git push
