name: Format PR #8

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manifest-import-control-center-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "apps/**/*.{ts,tsx,js,jsx,json,css,md}"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style(manifiestos): apply prettier formatting"
            git push origin HEAD:feat/manifest-import-control-center-v2
          fi
