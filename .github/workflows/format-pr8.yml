name: Format PR8

on:
  push:
    branches:
      - feat/manifest-import-control-center-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/manifiestos/manifiestos.importacion.escalable.service.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git add apps/api/src/manifiestos/manifiestos.importacion.escalable.service.ts
          git commit -m "chore: format manifest import service [prettier]"
          git push
