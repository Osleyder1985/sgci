name: Temporary Prettier 3.9.6 formatter

on:
  push:
    branches:
      - feat/geocoding-result-details

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format the three CI-failing files with Prettier 3.9.6
        run: npx --yes prettier@3.9.6 --write apps/api/src/manifiestos/manifiestos.importacion.geocodificacion.detalle.service.ts apps/api/src/manifiestos/manifiestos.importacion.observable.service.ts apps/web/src/app/operaciones/manifiestos/importar/page.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git add apps/api/src/manifiestos/manifiestos.importacion.geocodificacion.detalle.service.ts apps/api/src/manifiestos/manifiestos.importacion.observable.service.ts apps/web/src/app/operaciones/manifiestos/importar/page.tsx
          git commit -m "style(import): format with Prettier 3.9.6"
          git push
