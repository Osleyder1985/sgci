name: Format Manifest Import

on:
  push:
    branches:
      - feat/manifest-import-control-center-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/manifest-import-control-center-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed manifest files
        run: |
          npx prettier --write \
            apps/api/src/manifiestos/manifiestos.controller.ts \
            apps/api/src/manifiestos/manifiestos.importacion.progress.service.ts \
            apps/api/src/manifiestos/manifiestos.module.ts \
            apps/api/src/manifiestos/manifiestos.service.ts \
            apps/web/src/app/operaciones/manifiestos/importar/page.tsx

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/manifiestos/manifiestos.controller.ts \
            apps/api/src/manifiestos/manifiestos.importacion.progress.service.ts \
            apps/api/src/manifiestos/manifiestos.module.ts \
            apps/api/src/manifiestos/manifiestos.service.ts \
            apps/web/src/app/operaciones/manifiestos/importar/page.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format manifest import files"
            git push origin HEAD:feat/manifest-import-control-center-v2
          fi
