name: Apply LocationIQ precision v3

on:
  push:
    branches:
      - fix/geocoding-locationiq-precision-score

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Harden implementation
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/api/src/geocodificacion/geocodificacion.service.ts')
          s = p.read_text()
          s = s.replace('    municipality?: string;\n    suburb?: string;\n    state?: string;', '    municipality?: string;\n    suburb?: string;\n    county?: string;\n    state?: string;', 1)
          s = s.replace('  municipality?: string;\n  suburb?: string;\n  state?: string;', '  municipality?: string;\n  suburb?: string;\n  county?: string;\n  state?: string;', 1)
          s = s.replace('          municipality: firstResult.address?.municipality,\n          suburb: firstResult.address?.suburb,\n          state: firstResult.address?.state,', '          municipality: firstResult.address?.municipality,\n          suburb: firstResult.address?.suburb,\n          county: firstResult.address?.county,\n          state: firstResult.address?.state,', 1)
          old = '''    const street = [\n      direccion.calle,\n      direccion.numeroCasa ? `# ${direccion.numeroCasa}` : undefined,\n      direccion.entreCalles ? `E/ ${direccion.entreCalles}` : undefined,\n      direccion.apartamento\n        ? `APARTAMENTO ${direccion.apartamento}`\n        : undefined,\n      direccion.edificio ? `EDIFICIO ${direccion.edificio}` : undefined,\n      direccion.reparto ? `REPARTO ${direccion.reparto}` : undefined,\n    ]\n      .filter(Boolean)\n      .join(', ');'''
          new = '''    const street = [\n      direccion.calle,\n      direccion.numeroCasa ? `# ${direccion.numeroCasa}` : undefined,\n    ]\n      .filter(Boolean)\n      .join(', ');'''
          if old not in s: raise SystemExit('street anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace("    url.searchParams.set('addressdetails', '1');\n    url.searchParams.set('limit', '1');", "    url.searchParams.set('addressdetails', '1');\n    url.searchParams.set('normalizeaddress', '1');\n    url.searchParams.set('limit', '1');", 1)
          start = s.index('  private calcularPuntuacion(')
          end = s.index('  private obtenerMotivoIncompatibilidad(', start)
          method = '''  private calcularPuntuacion(\n    resultado: GeocodingResult,\n    esperado: DireccionCubanaNormalizada,\n  ): PuntuacionGeocodificacion {\n    const normalizar = (value?: string) =>\n      (value ?? '')\n        .toUpperCase()\n        .normalize('NFD')\n        .replace(/[\\u0300-\\u036f]/g, '')\n        .replace(/[^A-Z0-9]+/g, ' ')\n        .trim();\n    const esCuba = this.esProvinciaCubana(normalizar(esperado.provincia));\n    const provinciaEsperada = normalizar(esperado.provincia);\n    const municipioEsperado = normalizar(esperado.municipio);\n    const codigosEsperados = new Set((esperado.codigosPostales ?? []).map(normalizar));\n    const municipiosRecibidos = [resultado.address?.municipality, resultado.address?.county, resultado.address?.suburb, resultado.address?.city, resultado.address?.town, resultado.address?.village].map(normalizar).filter(Boolean);\n    const pais = !esCuba ? true : normalizar(resultado.address?.country) === 'CUBA';\n    const provincia = !provinciaEsperada || normalizar(resultado.address?.state) === provinciaEsperada;\n    const municipio = !municipioEsperado || municipiosRecibidos.includes(municipioEsperado);\n    const codigoPostal = !codigosEsperados.size || codigosEsperados.has(normalizar(resultado.address?.postcode));\n    const calle = !normalizar(esperado.calle) || normalizar(resultado.address?.road) === normalizar(esperado.calle);\n    const numeroEsperado = normalizar(esperado.numeroCasa);\n    const numeroRecibido = normalizar(resultado.address?.houseNumber);\n    const numero = !numeroEsperado || numeroRecibido === numeroEsperado;\n    const direccion = calle && numero;\n    const coincidencias = { pais, provincia, municipio, codigoPostal, direccion };\n    const total = Object.values(coincidencias).filter(Boolean).length;\n    return { total, maximo: 5, estrellas: total, coincidencias };\n  }\n\n'''
          s = s[:start] + method + s[end:]
          needle = '''    if (provinciaEsperada && provincia && provincia !== provinciaEsperada) {\n      return `provincia incompatible: esperada="${esperado.provincia}", recibida="${resultado.address?.state ?? ''}"`;\n    }\n\n'''
          addition = needle + '''    const calleEsperada = normalizar(esperado.calle);\n    const calleRecibida = normalizar(resultado.address?.road);\n    if (calleEsperada && calleRecibida && calleEsperada !== calleRecibida) {\n      return `calle incompatible: esperada="${esperado.calle}", recibida="${resultado.address?.road ?? ''}"`;\n    }\n\n    const numeroEsperado = normalizar(esperado.numeroCasa);\n    const numeroRecibido = normalizar(resultado.address?.houseNumber);\n    if (numeroEsperado && numeroRecibido && numeroEsperado !== numeroRecibido) {\n      return `numero incompatible: esperado="${esperado.numeroCasa}", recibido="${resultado.address?.houseNumber ?? ''}"`;\n    }\n\n'''
          if needle not in s: raise SystemExit('validation anchor not found')
          s = s.replace(needle, addition, 1)
          p.write_text(s)

          t = Path('apps/api/src/geocodificacion/geocodificacion.service.spec.ts')
          x = t.read_text()
          x = x.replace('          codigosPostales?: readonly string[];\n          canonica: string;', '          codigosPostales?: readonly string[];\n          canonica: string;', 1)
          x = x.replace('          provincia?: string;\n          canonica: string;', '          provincia?: string;\n          codigosPostales?: string[];\n          canonica: string;', 1)
          x = x.replace('          municipality?: string;\n          suburb?: string;', '          municipality?: string;\n          suburb?: string;\n          county?: string;', 1)
          t.write_text(x)
      - name: Format and test
        run: |
          npx --yes prettier@3.9.6 --write apps/api/src/geocodificacion/geocodificacion.service.ts apps/api/src/geocodificacion/geocodificacion.service.spec.ts
          npm ci
          npm run test --workspace=@sgci/api -- src/geocodificacion/geocodificacion.service.spec.ts
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/implement-locationiq-precision.yml .github/workflows/run-locationiq-precision-on-pr.yml .github/workflows/apply-locationiq-precision-v2.yml .github/workflows/apply-locationiq-precision-v3.yml .github/workflows/harden-locationiq-precision.yml
          git add apps/api/src/geocodificacion/geocodificacion.service.ts apps/api/src/geocodificacion/geocodificacion.service.spec.ts .github/workflows
          git commit -m "fix(geocoding): harden LocationIQ precision validation"
          git push origin HEAD:fix/geocoding-locationiq-precision-score
