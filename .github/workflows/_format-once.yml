name: SGCI Format Once

on:
  push:
    branches: [fix/format-manifest-import-page]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format manifest import page'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/app/operaciones/manifiestos/importar/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git add apps/web/src/app/operaciones/manifiestos/importar/page.tsx
          git commit -m "chore: format manifest import page"
          git push
