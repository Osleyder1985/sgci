name: Apply exact Prettier 3.9.6

on:
  push:
    branches:
      - fix/geocoding-cuba-semantic-parser
    paths:
      - '.github/workflows/apply-prettier-pr20.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geocoding-cuba-semantic-parser
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format exact failing file
        run: npx --yes prettier@3.9.6 --write apps/api/src/geocodificacion/geocodificacion.service.ts
      - name: Verify formatting
        run: npx --yes prettier@3.9.6 --check apps/api/src/geocodificacion/geocodificacion.service.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          git rm .github/workflows/apply-prettier-pr20.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/geocodificacion/geocodificacion.service.ts
          git diff --cached --quiet || git commit -m "style(geocoding): format with Prettier 3.9.6"
          git push origin HEAD:fix/geocoding-cuba-semantic-parser
