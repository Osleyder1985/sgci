name: Temporary geocoding consistency fix

on:
  push:
    branches:
      - feat/geocoding-result-details

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply functional fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('apps/api/src/manifiestos/manifiestos.importacion.escalable.service.ts')
          s = base.read_text()
          old = """      importCompleted = true;\n\n      await this.progress?.complete(jobId, response.mensaje, {"""
          new = """      await this.persistImportWarnings(jobId, response.warnings);\n\n      importCompleted = true;\n\n      await this.progress?.complete(jobId, response.mensaje, {"""
          if old not in s:
              raise SystemExit('base insertion point not found')
          s = s.replace(old, new, 1)
          marker = """  private async cleanupFailedImport(ctx: ImportRollbackContext) {"""
          hooks = """  protected async persistImportWarnings(\n    _jobId: string,\n    _warnings: string[],\n  ): Promise<void> {}\n\n"""
          if marker not in s:
              raise SystemExit('base hook marker not found')
          s = s.replace(marker, hooks + marker, 1)
          base.write_text(s)

          observable = Path('apps/api/src/manifiestos/manifiestos.importacion.observable.service.ts')
          s = observable.read_text()
          old = """  override async importar(buffer: Buffer, originalname: string, jobId: string) {\n    const response = await super.importar(buffer, originalname, jobId);\n    await this.detalles.guardarDesdeWarnings(jobId, response.warnings);\n    return response;\n  }"""
          new = """  protected override async persistImportWarnings(\n    jobId: string,\n    warnings: string[],\n  ): Promise<void> {\n    await this.detalles.guardarDesdeWarnings(jobId, warnings);\n  }"""
          if old not in s:
              raise SystemExit('observable method not found')
          s = s.replace(old, new, 1)
          observable.write_text(s)
          PY

      - name: Format changed files with Prettier 3.9.6
        run: npx --yes prettier@3.9.6 --write apps/api/src/manifiestos/manifiestos.importacion.escalable.service.ts apps/api/src/manifiestos/manifiestos.importacion.observable.service.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/manifiestos/manifiestos.importacion.escalable.service.ts apps/api/src/manifiestos/manifiestos.importacion.observable.service.ts
          git commit -m "fix(import): persist geocoding details before completion"
          git push
