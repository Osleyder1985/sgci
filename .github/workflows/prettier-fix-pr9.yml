name: Temporary Prettier Fix PR 9

on:
  push:
    branches:
      - feat/cuba-territorial-catalog-normalization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/cuba-territorial-catalog-normalization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Prettier 3.9.6
        run: npx prettier@3.9.6 --write apps/api/src/geocodificacion/cuba-territorial.service.spec.ts apps/api/src/geocodificacion/cuba-territorial.service.ts

      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/geocodificacion/cuba-territorial.service.spec.ts apps/api/src/geocodificacion/cuba-territorial.service.ts .github/workflows/prettier-fix-pr9.yml
          git rm .github/workflows/prettier-fix-pr9.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(api): apply Prettier 3.9.6 formatting"
          git push origin HEAD:feat/cuba-territorial-catalog-normalization
