name: Temporary Prettier 3.9.6

on:
  push:
    branches:
      - fix/geocoding-cuba-catalog-sync-import

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes prettier@3.9.6 --write apps/api/scripts/sync-ecured-localidades.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
          else
            git add apps/api/scripts/sync-ecured-localidades.ts
            git commit -m "style: format EcuRed catalog sync script with Prettier 3.9.6"
            git push
          fi
