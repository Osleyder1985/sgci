name: Temporary Prettier Fix PR21

on:
  push:
    branches:
      - fix/geocoding-semantic-territory-score

permissions:
  contents: write

jobs:
  prettier-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format failing file with Prettier 3.9.6
        run: npx prettier@3.9.6 --write apps/api/src/geocodificacion/cuba-territorial.service.ts

      - name: Commit formatting change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git add apps/api/src/geocodificacion/cuba-territorial.service.ts
          git commit -m "style: format Cuba territorial service with Prettier 3.9.6"
          git push
